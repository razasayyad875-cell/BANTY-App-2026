<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BANTY Learning</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.header{
padding:20px;
font-size:30px;
font-weight:bold;
background:#111827;
color:#38bdf8;
box-shadow:0 0 10px #38bdf8;
}

.container{
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.5);
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:18px;
background:#38bdf8;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#0284c7;
}

h2{
color:#22c55e;
}

#result{
font-size:22px;
margin-top:20px;
color:#facc15;
}

.footer{
margin-top:30px;
padding:20px;
background:#111827;
color:#94a3b8;
}

</style>

</head>

<body>

<div class="header">
🚀 BANTY Learning
</div>

<div class="container">

<h2 id="score">
Score: 0
</h2>

<div class="card">

<h1>
NEET Quiz
</h1>

<h3>
Q1. Human heart has how many chambers?
</h3>

<button onclick="checkAnswer('A',this)">
A. 2
</button>

<button onclick="checkAnswer('B',this)">
B. 3
</button>

<button onclick="checkAnswer('C',this)">
C. 4
</button>

<button onclick="checkAnswer('D',this)">
D. 5
</button>

</div>

<div class="card">

<h3>
Q2. DNA ka full form kya hai?
</h3>

<button onclick="checkAnswer2('A',this)">
A. Deoxyribo Nucleic Acid
</button>

<button onclick="checkAnswer2('B',this)">
B. Dynamic Nuclear Acid
</button>

<button onclick="checkAnswer2('C',this)">
C. Double Nitrogen Atom
</button>

<button onclick="checkAnswer2('D',this)">
D. None
</button>

</div>

<div class="card">

<h3>
Q3. Largest organ in human body?
</h3>

<button onclick="checkAnswer3('A',this)">
A. Heart
</button>

<button onclick="checkAnswer3('B',this)">
B. Liver
</button>

<button onclick="checkAnswer3('C',this)">
C. Skin
</button>

<button onclick="checkAnswer3('D',this)">
D. Kidney
</button>

</div>

<h2 id="result">
Answer Result
</h2>

</div>

<div class="footer">
Made By BANTY Raza 🚀
</div>

<script>

var score = 0;

function updateScore(){

document.getElementById("score").innerHTML =
"Score: " + score;

}

function disableButtons(btn){

var buttons =
btn.parentElement.querySelectorAll("button");

buttons.forEach(function(b){

b.disabled = true;

b.style.opacity = "0.5";

});

}

function checkAnswer(ans,btn){

disableButtons(btn);

if(ans=="C"){

btn.style.background = "green";

score++;

updateScore();

document.getElementById("result").innerHTML =
"✅ Correct Answer";

}else{

btn.style.background = "red";

document.getElementById("result").innerHTML =
"❌ Wrong Answer";

}

}

function checkAnswer2(ans,btn){

disableButtons(btn);

if(ans=="A"){

btn.style.background = "green";

score++;

updateScore();

document.getElementById("result").innerHTML =
"✅ Correct Answer";

}else{

btn.style.background = "red";

document.getElementById("result").innerHTML =
"❌ Wrong Answer";

}

}

function checkAnswer3(ans,btn){

disableButtons(btn);

if(ans=="C"){

btn.style.background = "green";

score++;

updateScore();

document.getElementById("result").innerHTML =
"✅ Correct Answer";

}else{

btn.style.background = "red";

document.getElementById("result").innerHTML =
"❌ Wrong Answer";

}

}

</script>

</body>

</html>
